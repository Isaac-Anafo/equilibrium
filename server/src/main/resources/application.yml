server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: equilibrium

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/equilibrium}
    username: ${DB_USERNAME:equilibrium}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
    show-sql: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl-minutes: 15
    refresh-ttl-days: 30
    issuer: equilibrium-api

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8443,https://equilibrium-umber.vercel.app}

  auth:
    password-min-length: 8
    reset-token-ttl-minutes: 30
    login-rate-limit-per-minute: 10
    reset-link-base-url: ${FRONTEND_URL:http://localhost:8443}

  mail:
    from: ${MAIL_FROM:no-reply@equilibrium.app}

  chat:
    enabled: ${CHAT_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${CHAT_BASE_URL:https://api.openai.com/v1/chat/completions}

  rebalance:
    auto-approve-max-amount: 500
    commission-bps: 0

  pricing:
    source: ${PRICE_SOURCE:fixture}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    com.equilibrium: DEBUG
    org.hibernate.SQL: WARN
